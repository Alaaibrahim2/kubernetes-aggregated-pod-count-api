apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-count-api
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-count-api
rules:
  - apiGroups: [""]
    resources:
      - pods
      - namespaces
    verbs:
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pod-count-api
subjects:
  - kind: ServiceAccount
    name: pod-count-api
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pod-count-api
